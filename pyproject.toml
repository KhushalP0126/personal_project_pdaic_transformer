[project]
name = "personal-project-pdaic-transformer"
version = "0.1.0"
description = "p-adic transformer synthetic dataset and benchmark harness"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.4",
  "scikit-learn==1.9.0",
  "torch==2.11.0",
  "kaggle==2.2.2",
]

[build-system]
requires = ["setuptools==65.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
