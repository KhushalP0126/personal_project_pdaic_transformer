[project]
name = "personal-project-pdaic-transformer"
version = "0.1.0"
description = "p-adic transformer synthetic dataset and benchmark harness"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "kaggle>=1.6",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
