name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Unit tests
        run: |
          . .venv/bin/activate
          make test
      - name: Study runner compile check
        run: |
          . .venv/bin/activate
          python -m py_compile scripts/run_ip_characterization_study.py
